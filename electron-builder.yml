appId: com.ipmi.gui
productName: IPMI管理工具
directories:
  output: dist

files:
  - "**/*"
  - "!node_modules/.cache/**/*"
  - "!dist/**/*"
  - "!coverage/**/*"
  - "!__tests__/**/*"
  - "!bin/**/*"
  - "!.codex/**/*"
  - "!.mimocode/**/*"
  - "!.reasonix/**/*"
  - "!.workbuddy-ai/**/*"
  - "!example_servers.json"
  - "!build.bat"
  - "!build-installer.bat"

asar: true

# ipmitool.exe + Cygwin DLL 复制到 resources/bin
# （与 src/modules/ipmiTool.js 的首选查找路径一致，构建脚本不再手动复制）
extraResources:
  - from: bin
    to: bin
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: "${productName}-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  uninstallerIcon: assets/icon.ico
  shortcutName: IPMI管理工具

portable:
  artifactName: "${productName}-${version}-portable.${ext}"
