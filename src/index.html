<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';">
  <title>IPMI 管理工具</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../node_modules/xterm/css/xterm.css">
</head>
<body>
  <div class="app">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <label>服务器</label>
        <select id="server-select">
          <option value="">-- 选择服务器 --</option>
        </select>
        <button id="btn-add-server" class="btn btn-sm" data-tooltip="添加新服务器">添加</button>
        <button id="btn-edit-server" class="btn btn-sm" data-tooltip="编辑当前服务器">编辑</button>
        <button id="btn-delete-server" class="btn btn-sm btn-danger" data-tooltip="删除当前服务器">删除</button>
        <button id="btn-batch-delete" class="btn btn-sm btn-danger" data-tooltip="批量删除多台服务器">批量删除</button>
        <button id="btn-test-connection" class="btn btn-sm btn-success" data-tooltip="测试服务器连接">测试连接</button>
        <span class="separator"></span>
        <button id="btn-import-config" class="btn btn-sm" data-tooltip="导入服务器配置">导入</button>
        <button id="btn-export-config" class="btn btn-sm" data-tooltip="导出服务器配置">导出</button>
      </div>
      <div class="toolbar-right">
        <span id="memory-info" class="memory-badge" data-tooltip="应用内存使用" data-tooltip-multiline data-tooltip-align="right">-- MB</span>
        <span id="status-text" class="status-badge"><span class="badge-text">未连接</span></span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="sol">SOL 终端</button>
        <button class="tab" data-tab="favorites">收藏夹</button>
        <button class="tab" data-tab="scan">网络扫描</button>
        <button class="tab" data-tab="power">电源</button>
        <button class="tab" data-tab="sensor">传感器</button>
        <button class="tab" data-tab="fru">FRU</button>
        <button class="tab" data-tab="sel">事件日志</button>
        <button class="tab" data-tab="user">用户</button>
        <button class="tab" data-tab="network">网络</button>
        <button class="tab" data-tab="raw">原始命令</button>
      </div>

      <!-- SOL Panel -->
      <div id="panel-sol" class="panel active">
        <div class="panel-toolbar">
          <button id="btn-sol-start" class="btn btn-primary">启动 SOL</button>
          <button id="btn-sol-stop" class="btn btn-warning">停止 SOL</button>
          <span class="separator"></span>
          <button id="btn-sol-save" class="btn btn-ghost">保存日志</button>
          <button id="btn-sol-logdir" class="btn btn-ghost">日志目录</button>
          <span id="sol-logdir-text" class="logdir-display"></span>
          <span class="separator"></span>
          <button id="btn-sol-clear" class="btn btn-ghost">清屏</button>
        </div>
        <!-- SOL 标签栏 -->
        <div id="sol-tabs" class="sol-tabs">
          <div id="sol-tab-list" class="sol-tab-list"></div>
          <button id="btn-sol-new-tab" class="sol-tab-add" title="新建终端">+</button>
        </div>
        <!-- 终端容器 -->
        <div id="sol-terminals" class="sol-terminals"></div>
      </div>

      <!-- Favorites Panel -->
      <div id="panel-favorites" class="panel">
        <div class="panel-toolbar">
          <label data-tooltip="按分类筛选收藏命令" data-tooltip-align="left">分类:</label>
          <select id="fav-category-filter" class="input-command" style="width:120px"></select>
          <span class="separator"></span>
          <button id="btn-add-favorite" class="btn btn-primary">添加收藏</button>
          <button id="btn-exec-favorite" class="btn btn-success" disabled>执行选中</button>
          <button id="btn-edit-favorite" class="btn" disabled>编辑</button>
          <button id="btn-delete-favorite" class="btn btn-danger" disabled>删除</button>
          <span class="separator"></span>
          <button id="btn-move-up" class="btn btn-ghost" disabled>上移</button>
          <button id="btn-move-down" class="btn btn-ghost" disabled>下移</button>
          <span class="separator"></span>
          <button id="btn-import-favorites" class="btn btn-ghost" data-tooltip="从 JSON 文件导入收藏" data-tooltip-align="right">导入</button>
          <button id="btn-export-favorites" class="btn btn-ghost" data-tooltip="导出收藏为 JSON 文件" data-tooltip-align="right">导出</button>
        </div>
        <div class="favorites-container">
          <div id="favorites-list" class="favorites-list"></div>
          <pre id="favorites-preview" class="output-area">选择收藏的命令查看详情</pre>
        </div>
      </div>

      <!-- Favorites Dialog -->
      <div id="favorite-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog">
          <div class="dialog-header">
            <h3 id="fav-dialog-title">添加收藏</h3>
            <button class="dialog-close" id="fav-dialog-close">&times;</button>
          </div>
          <div class="dialog-body">
            <div class="form-group">
              <label>名称</label>
              <input type="text" id="fav-name" placeholder="例: 查询电源状态">
            </div>
            <div class="form-group">
              <label>命令</label>
              <input type="text" id="fav-command" placeholder="例: power status">
            </div>
            <div class="form-group">
              <label>分类</label>
              <select id="fav-category"></select>
            </div>
            <div class="form-group">
              <label>描述（可选）</label>
              <input type="text" id="fav-desc" placeholder="例: 查询服务器当前电源状态">
            </div>
          </div>
          <div class="dialog-footer">
            <button class="btn" id="fav-cancel">取消</button>
            <button class="btn btn-primary" id="fav-save">确定</button>
          </div>
        </div>
      </div>

      <!-- Network Scan Panel -->
      <div id="panel-scan" class="panel">
        <div class="panel-toolbar">
          <label>网段:</label>
          <input type="text" id="scan-subnet" class="input-command" placeholder="192.168.1.0" style="width:150px">
          <label data-tooltip="支持 /24 ~ /30，低于 /24 按 /24 处理">/</label>
          <input type="number" id="scan-cidr" class="input-command" value="24" min="24" max="30" style="width:60px">
          <span class="separator"></span>
          <label>超时:</label>
          <input type="number" id="scan-timeout" class="input-command" value="200" min="50" max="1000" style="width:70px">
          <label>ms</label>
          <span class="separator"></span>
          <label class="checkbox-label" data-tooltip="勾选：先 Ping 探测存活主机再扫端口（快）｜不勾选：对网段内所有地址直接扫端口，可发现禁 Ping 设备（慢）">
            <input type="checkbox" id="scan-use-ping" checked>
            Ping 预探测
          </label>
          <span class="separator"></span>
          <button id="btn-scan-start" class="btn btn-primary">开始扫描</button>
          <button id="btn-scan-stop" class="btn btn-danger" disabled>停止</button>
        </div>
        <!-- 进度条 -->
        <div style="padding: 10px 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle);">
          <div style="display:flex; align-items:center; gap:10px;">
            <span id="scan-phase" style="font-size:12px; color:var(--text-muted);">就绪</span>
            <div style="flex:1; height:6px; background:var(--bg-overlay); border-radius:3px; overflow:hidden;">
              <div id="scan-progress-bar" style="width:0%; height:100%; background:var(--accent); transition:width 0.3s;"></div>
            </div>
            <span id="scan-progress-text" style="font-size:12px; color:var(--text-muted); min-width:120px;">0/0</span>
            <span id="scan-found-count" style="font-size:12px; color:var(--success);">发现: 0台</span>
          </div>
        </div>
        <!-- 扫描结果 -->
        <div style="flex:1; overflow:auto; padding:8px 16px;">
          <div id="scan-results" style="min-height:100px;">
            <div style="text-align:center; color:var(--text-muted); padding:40px;">点击"开始扫描"发现网络中的 IPMI 设备</div>
          </div>
        </div>
        <!-- 底部操作 -->
        <div class="panel-toolbar">
          <button id="btn-scan-select-all" class="btn btn-sm">全选</button>
          <button id="btn-scan-deselect-all" class="btn btn-sm">取消全选</button>
          <span class="separator"></span>
          <button id="btn-scan-add-selected" class="btn btn-sm btn-primary" disabled>批量添加</button>
          <button id="btn-scan-export" class="btn btn-sm btn-ghost">导出结果</button>
        </div>
      </div>

      <!-- Power Panel -->
      <div id="panel-power" class="panel">
        <div class="panel-toolbar">
          <button id="btn-power-status" class="btn">查询状态</button>
          <span class="separator"></span>
          <button id="btn-power-on" class="btn btn-success">开机</button>
          <button id="btn-power-off" class="btn btn-danger">关机</button>
          <button id="btn-power-cycle" class="btn btn-warning">重启</button>
          <span class="separator"></span>
          <button class="btn btn-ghost btn-clear" data-target="output-power">清屏</button>
        </div>
        <pre id="output-power" class="output-area">点击按钮执行命令...</pre>
      </div>

      <!-- Sensor Panel -->
      <div id="panel-sensor" class="panel">
        <div class="panel-toolbar">
          <button id="btn-sensor-refresh" class="btn btn-primary">刷新数据</button>
          <span class="separator"></span>
          <button class="btn btn-ghost btn-clear" data-target="output-sensor">清屏</button>
        </div>
        <pre id="output-sensor" class="output-area">点击刷新获取传感器数据...</pre>
      </div>

      <!-- FRU Panel -->
      <div id="panel-fru" class="panel">
        <div class="panel-toolbar">
          <button id="btn-fru-refresh" class="btn btn-primary">刷新数据</button>
          <span class="separator"></span>
          <button class="btn btn-ghost btn-clear" data-target="output-fru">清屏</button>
        </div>
        <pre id="output-fru" class="output-area">点击刷新获取 FRU 信息...</pre>
      </div>

      <!-- SEL Panel -->
      <div id="panel-sel" class="panel">
        <div class="panel-toolbar">
          <button id="btn-sel-refresh" class="btn btn-primary">刷新日志</button>
          <button id="btn-sel-info" class="btn">日志信息</button>
          <span class="separator"></span>
          <button class="btn btn-ghost btn-clear" data-target="output-sel">清屏</button>
        </div>
        <pre id="output-sel" class="output-area">点击刷新获取事件日志...</pre>
      </div>

      <!-- User Panel -->
      <div id="panel-user" class="panel">
        <div class="panel-toolbar">
          <button id="btn-user-refresh" class="btn btn-primary">刷新列表</button>
          <span class="separator"></span>
          <button class="btn btn-ghost btn-clear" data-target="output-user">清屏</button>
        </div>
        <pre id="output-user" class="output-area">点击刷新获取用户列表...</pre>
      </div>

      <!-- Network Panel -->
      <div id="panel-network" class="panel">
        <div class="panel-toolbar">
          <button id="btn-network-refresh" class="btn btn-primary">刷新配置</button>
          <span class="separator"></span>
          <button class="btn btn-ghost btn-clear" data-target="output-network">清屏</button>
        </div>
        <pre id="output-network" class="output-area">点击刷新获取网络配置...</pre>
      </div>

      <!-- Raw Command Panel -->
      <div id="panel-raw" class="panel">
        <div class="panel-toolbar">
          <input type="text" id="raw-command" class="input-command" placeholder="输入 ipmitool 命令，如: chassis status">
          <button id="btn-raw-execute" class="btn btn-primary">执行</button>
          <span class="separator"></span>
          <button class="btn btn-ghost btn-clear" data-target="output-raw">清屏</button>
        </div>
        <pre id="output-raw" class="output-area">输入命令并点击执行...</pre>
      </div>
    </div>
  </div>

  <!-- Server Dialog -->
  <div id="server-dialog" class="dialog-overlay" style="display: none;">
    <div class="dialog">
      <div class="dialog-header">
        <h3 id="dialog-title">添加服务器</h3>
        <button class="dialog-close" id="server-dialog-close">&times;</button>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label>快速填充模板</label>
          <select id="server-template">
            <option value="">-- 选择模板 --</option>
            <option value="openubmc">openUBMC (Administrator / ttytty`12)</option>
            <option value="ami">AMI (admin / admin)</option>
            <option value="openbmc">OpenBMC (root / 0penBmc)</option>
          </select>
        </div>
        <div class="form-group">
          <label>名称</label>
          <input type="text" id="server-name" placeholder="生产服务器-01">
        </div>
        <div class="form-group">
          <label>IP 地址</label>
          <input type="text" id="server-host" placeholder="192.168.1.100">
        </div>
        <div class="form-group">
          <label>端口</label>
          <input type="number" id="server-port" value="623">
        </div>
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="server-username" placeholder="ADMIN">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="server-password">
        </div>
        <div class="form-group">
          <label>接口</label>
          <select id="server-interface">
            <option value="lanplus">lanplus (IPMI v2.0)</option>
            <option value="lan">lan (IPMI v1.5)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Cipher Suite</label>
          <input type="number" id="server-cipher" value="17" min="0" max="17">
        </div>
      </div>
      <div class="dialog-footer">
        <button class="btn" id="server-cancel">取消</button>
        <button class="btn btn-primary" id="server-save">确定</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
