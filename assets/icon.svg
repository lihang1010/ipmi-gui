<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Square background with rounded corners -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="16" fill="url(#bgGrad)" stroke="#0D47A1" stroke-width="2"/>
  
  <!-- IPMI text - large and bold -->
  <text x="64" y="72" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">IPMI</text>
  
  <!-- Subtitle line -->
  <rect x="24" y="82" width="80" height="3" rx="1.5" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Small decorative dots -->
  <circle cx="34" cy="100" r="3" fill="#4CAF50"/>
  <circle cx="64" cy="100" r="3" fill="#4CAF50"/>
  <circle cx="94" cy="100" r="3" fill="#4CAF50"/>
  
  <!-- Top corner accent -->
  <rect x="12" y="12" width="20" height="4" rx="2" fill="#FFFFFF" opacity="0.4"/>
</svg>
